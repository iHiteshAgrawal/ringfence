[project]
name = "ringfence"
version = "0.1.0"
description = "Abuse-ring detection and chargeback dispute drafting for card-not-present fraud. Defense-only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.8",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[project.scripts]
ringfence = "ringfence.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ringfence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
